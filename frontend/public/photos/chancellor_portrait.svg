<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1a17" />
      <stop offset="60%" stop-color="#121210" />
      <stop offset="100%" stop-color="#0b0b0a" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C98A" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C9A45C" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9B7A38" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#bg)" />
  <rect x="20" y="20" width="560" height="710" rx="24" fill="none" stroke="url(#goldRim)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  
  <!-- Silhouette & Noble Insignia -->
  <g transform="translate(300, 310)" text-anchor="middle">
    <circle r="110" fill="#171614" stroke="#C9A45C" stroke-width="1.5" opacity="0.6" />
    <!-- Classical University Seal Motif -->
    <path d="M-50,-30 L0,-65 L50,-30 L35,45 L-35,45 Z" fill="none" stroke="#E4C98A" stroke-width="2" opacity="0.8" />
    <path d="M-30,-15 L0,-38 L30,-15 L20,30 L-20,30 Z" fill="none" stroke="#C9A45C" stroke-width="1" opacity="0.5" />
    <circle r="8" fill="#E4C98A" opacity="0.9" />
    <path d="M0,-8 L0,-30 M-8,0 L-22,0 M8,0 L22,0 M0,8 L0,22" stroke="#E4C98A" stroke-width="1.5" />
  </g>

  <!-- Typography -->
  <text x="300" y="490" text-anchor="middle" font-family="serif" font-size="28" font-weight="600" fill="#F5F2EA" letter-spacing="2">KUNWAR SHEKHAR VIJENDRA</text>
  <text x="300" y="525" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#C9A45C" letter-spacing="4">CO-FOUNDER &amp; CHANCELLOR</text>
  <text x="300" y="555" text-anchor="middle" font-family="serif" font-style="italic" font-size="14" fill="#9B968B">Shobhit University</text>
  
  <text x="300" y="660" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#757065" letter-spacing="1">OFFICIAL APPROVED PORTRAIT</text>
</svg>
